<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenzi Garden - Botanik & Çiçek Mağazası</title>
  
  <!-- Tailwind CSS Framework -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- İkon Kütüphanesi -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- Harici Özel CSS Dosyamız -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full border border-[#4A3525] flex items-center justify-center text-[#4A3525]">
          <i class="fas fa-seedling"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-widest text-[#4A3525]">KENZI GARDEN</h1>
      </div>
      
      <button onclick="toggleCart()" class="relative bg-[#2D4A3E] text-white px-5 py-2.5 rounded-full flex items-center gap-3 hover:opacity-90 transition-custom">
        <i class="fas fa-shopping-bag"></i>
        <span class="font-medium">Sepetim</span>
        <span id="cart-count" class="bg-white text-[#2D4A3E] text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- Banner -->
  <section class="max-w-6xl mx-auto px-4 py-12 text-center">
    <span class="text-xs font-semibold uppercase tracking-widest text-[#2D4A3E] mb-2 block">Patch Plants İlhamıyla</span>
    <h2 class="text-4xl md:text-5xl font-serif font-bold text-[#4A3525] mb-4">Evlerinize Doğal Bir Dokunuş</h2>
    <p class="text-gray-600 max-w-xl mx-auto text-sm md:text-base">Özenle yetiştirilmiş salon bitkileri ve özel tasarım çiçek buketleri ile yaşam alanlarınızı renklendirin.</p>
  </section>

  <!-- Ürünler Izgarası -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <p class="text-center col-span-full text-gray-500 py-12">Ürünler yükleniyor...</p>
    </div>
  </main>

  <!-- Sepet Yan Paneli -->
  <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between overflow-y-auto">
      <div>
        <div class="flex justify-between items-center mb-6 pb-4 border-b">
          <h3 class="text-xl font-bold text-[#4A3525]">Sipariş Sepetiniz</h3>
          <button onclick="toggleCart()" class="text-gray-400 hover:text-black"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="cart-items" class="space-y-4 mb-6">
          <p class="text-gray-500 text-center">Sepetiniz henüz boş.</p>
        </div>
      </div>

      <div class="border-t pt-4">
        <div class="flex justify-between font-bold text-lg mb-4">
          <span>Toplam Tutar:</span>
          <span id="cart-total">0 TL</span>
        </div>
        
        <div class="space-y-3 mb-4">
          <input type="text" id="cust-name" placeholder="Adınız Soyadınız" class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:border-[#2D4A3E]">
          <textarea id="cust-address" placeholder="Teslimat Adresiniz" class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:border-[#2D4A3E]" rows="2"></textarea>
        </div>

        <button onclick="sendWhatsAppOrder()" class="w-full bg-[#25D366] text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 transition-custom">
          <i class="fab fa-whatsapp text-xl"></i> WhatsApp ile Sipariş Ver
        </button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Yapılandırması
    const firebaseConfig = {
      apiKey: "AIzaSyAaxzHiu1Ya-Wcni1RT7Rso4phrJ-ppeoE",
      authDomain: "kenzi-garden.firebaseapp.com",
      projectId: "kenzi-garden",
      storageBucket: "kenzi-garden.firebasestorage.app",
      messagingSenderId: "537211811884",
      appId: "1:537211811884:web:477222a1e7de3167367989",
      measurementId: "G-QPGDBD1EJ6"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const WHATSAPP_NUMBER = "905338400301"; // Telefon numaranız

    let cart = [];

    // Veritabanından Ürünleri Çek
    db.collection("products").onSnapshot((snapshot) => {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';
      if(snapshot.empty) {
        grid.innerHTML = '<p class="text-center col-span-full text-gray-500">Henüz mağazada ürün bulunmuyor.</p>';
        return;
      }
      snapshot.forEach((doc) => {
        const item = doc.data();
        grid.innerHTML += `
          <div class="bg-white rounded-2xl overflow-hidden product-card flex flex-col justify-between">
            <div>
              <img src="${item.image || 'https://images.unsplash.com/photo-1545241047-6083a3684587?w=500'}" class="w-full h-64 object-cover" alt="${item.name}">
              <div class="p-5">
                <span class="text-xs text-[#2D4A3E] font-semibold tracking-wider uppercase">${item.category || 'Genel'}</span>
                <h3 class="font-bold text-lg text-[#4A3525] mt-1 mb-2">${item.name}</h3>
                <p class="text-stone-500 text-xs mb-4">${item.desc || ''}</p>
              </div>
            </div>
            <div class="p-5 pt-0 flex justify-between items-center border-t border-stone-50">
              <span class="font-bold text-xl text-[#4A3525]">${item.price} TL</span>
              <button onclick="addToCart('${item.name}', ${item.price})" class="bg-[#2D4A3E] text-white px-4 py-2 rounded-xl text-sm font-medium hover:opacity-90 transition-custom">
                + Sepete Ekle
              </button>
            </div>
          </div>
        `;
      });
    });

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      const container = document.getElementById('cart-items');
      let total = 0;
      
      if(cart.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center">Sepetiniz henüz boş.</p>';
      } else {
        container.innerHTML = '';
        cart.forEach((item, index) => {
          total += item.price;
          container.innerHTML += `
            <div class="flex justify-between items-center border-b pb-2">
              <div>
                <p class="font-bold text-sm">${item.name}</p>
                <p class="text-xs text-gray-500">${item.price} TL</p>
              </div>
              <button onclick="removeFromCart(${index})" class="text-red-500 text-xs"><i class="fas fa-trash"></i> Sil</button>
            </div>
          `;
        });
      }
      document.getElementById('cart-total').innerText = `${total} TL`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
    }

    function sendWhatsAppOrder() {
      const name = document.getElementById('cust-name').value;
      const address = document.getElementById('cust-address').value;

      if (cart.length === 0) { alert('Sepetiniz boş!'); return; }
      if (!name || !address) { alert('Lütfen adınızı ve adresinizi doldurun.'); return; }

      let message = `🌿 *KENZI GARDEN SİPARİŞİ*\n\n`;
      message += `*Müşteri:* ${name}\n`;
      message += `*Adres:* ${address}\n\n`;
      message += `*Sipariş Edilen Ürünler:*\n`;

      let total = 0;
      cart.forEach(item => {
        message += `- ${item.name} (${item.price} TL)\n`;
        total += item.price;
      });

      message += `\n*Toplam Tutar:* ${total} TL`;

      const encodedMessage = encodeURIComponent(message);
      window.location.href = `https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodedMessage}`;
    }
  </script>
</body>
</html>
