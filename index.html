<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenzi Garden - Botanik & Çiçek Mağazası</title>
  
  <!-- Tailwind CSS Framework -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- İkon Kütüphanesi -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- Harici Özel CSS Dosyamız -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full border border-[#4A3525] flex items-center justify-center text-[#4A3525]">
          <i class="fas fa-seedling"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-widest text-[#4A3525]">KENZI GARDEN</h1>
      </div>
      
      <button onclick="toggleCart()" class="relative bg-[#2D4A3E] text-white px-5 py-2.5 rounded-full flex items-center gap-3 hover:opacity-90 transition-custom">
        <i class="fas fa-shopping-bag"></i>
        <span class="font-medium">Sepetim</span>
        <span id="cart-count" class="bg-white text-[#2D4A3E] text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- Banner -->
  <section class="max-w-6xl mx-auto px-4 py-12 text-center">
    <span class="text-xs font-semibold uppercase tracking-widest text-[#2D4A3E] mb-2 block">Patch Plants İlhamıyla</span>
    <h2 class="text-4xl md:text-5xl font-serif font-bold text-[#4A3525] mb-4">Evlerinize Doğal Bir Dokunuş</h2>
    <p class="text-gray-600 max-w-xl mx-auto text-sm md:text-base">Özenle yetiştirilmiş salon bitkileri ve özel tasarım çiçek buketleri ile yaşam alanlarınızı renklendirin.</p>
  </section>

  <!-- Ürünler Izgarası -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <p class="text-center col-span-full text-gray-500 py-12">Ürünler yükleniyor...</p>
    </div>
  </main>

  <!-- Sepet Yan Paneli -->
  <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between overflow-y-auto">
      <div>
        <div class="flex justify-between items-center mb-6 pb-4 border-b">
          <h3 class="text-xl font-bold text-[#4A3525]">Sipariş Sepetiniz</h3>
          <button onclick="toggleCart()" class="text-gray-400 hover:text-black"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="cart-items" class="space-y-4 mb-6">
          <p class="text-gray-500 text-center">Sepetiniz henüz boş.</p>
        </div>
      </div>

      <div class="border-t pt-4">
        <div class="flex justify-between font-bold text-lg mb-4">
          <span>Toplam Tutar:</span>
          <span id="cart-total">0 TL</span>
        </div>
        
        <div class="space-y-3 mb-4">
          <input type="text" id="cust-name" placeholder="Adınız Soyadınız" class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:border-[#2D4A3E]">
          <textarea id="cust-address" placeholder="Teslimat Adresiniz" class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:border-[#2D4A3E]" rows="2"></textarea>
        </div>

        <button onclick="sendWhatsAppOrder()" class="w-full bg-[#25D366] text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 transition-custom">
          <i class="fab fa-whatsapp text-xl"></i> WhatsApp ile Sipariş Ver
        </button>
      </div>
    </div>
  </div>

  <!-- Harici JavaScript Dosyamız -->
  <script src="js/app.js"></script>
</body>
</html>
